parameters:
    bcmath.scale: 4
    base.currency: EUR
    deposit.business.fee: '0.03'
    deposit.private.fee: '0.03'
    withdraw.business.fee: '0.5'
    withdraw.private.fee: '0.3'
    withdraw.private.free.amount.per.week: '1000'
    withdraw.private.free.count.per.week: 3
    rate.api.url: https://api.exchangeratesapi.io/latest

services:
    _defaults:
        autowire: true
        autoconfigure: true

        bind:
            $bcmathScale: '%bcmath.scale%'
            $baseCurrency: '%base.currency%'

    App\:
        resource: '../src/*'
        exclude: '../src/{Model,Kernel.php}'

    Symfony\Contracts\HttpClient\HttpClientInterface:
        factory: ['Symfony\Component\HttpClient\HttpClient', 'create']

    App\DataProvider\RateDataProvider:
        class: App\DataProvider\RateDataProvider
        arguments:
            $url: '%rate.api.url%'

    # Every commission policy is its own immutable strategy instance, configured
    # through the constructor. The business identity of a policy is the "policy"
    # tag attribute, so two policies may share an implementation class without
    # sharing state.
    app.commission.deposit_private:
        class: App\Commission\FixedFeeStrategy
        arguments:
            $fee: '%deposit.private.fee%'
        tags:
            - { name: app.commission_policy, policy: 'deposit.private' }

    app.commission.deposit_business:
        class: App\Commission\FixedFeeStrategy
        arguments:
            $fee: '%deposit.business.fee%'
        tags:
            - { name: app.commission_policy, policy: 'deposit.business' }

    app.commission.withdraw_business:
        class: App\Commission\FixedFeeStrategy
        arguments:
            $fee: '%withdraw.business.fee%'
        tags:
            - { name: app.commission_policy, policy: 'withdraw.business' }

    app.commission.withdraw_private:
        class: App\Commission\RangeStrategy
        arguments:
            $fee: '%withdraw.private.fee%'
            $freeAmountPerWeek: '%withdraw.private.free.amount.per.week%'
            $freeWithdrawCountPerWeek: '%withdraw.private.free.count.per.week%'
        tags:
            - { name: app.commission_policy, policy: 'withdraw.private' }

    App\Service\CommissionCalculator:
        class: App\Service\CommissionCalculator
        arguments:
            $policies: !tagged_iterator { tag: app.commission_policy, index_by: policy }
